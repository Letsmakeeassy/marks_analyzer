<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Student Marks Analyzer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
    }

    h2 {
      margin-top: 24px;
    }

    input,
    select,
    button {
      padding: 6px;
      margin: 4px 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 12px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card {
      border: 1px solid #6a6767;
      padding: 12px;
      border-radius: 8px;
    }

    .small {
      font-size: 12px;
      color: #000000;
    }
  </style>
</head>

<body style="background-color: #e0e8ff;">
  <h1>Student Marks Analyzer</h1>

  <div class="card">
    <h2>Subjects</h2>
    <div class="row">
      <input id="subjectName" placeholder="Subject name (e.g., Math)" />
      <button id="addSubjectBtn">Add subject</button>
      <button id="clearSubjectsBtn">Clear subjects</button>
    </div>
    <div class="small">Add subjects first. You can edit marks later.</div>
    <ul id="subjectsList"></ul>
  </div>

  <div class="card">
    <h2>Add student</h2>
    <div class="row">
      <input id="studentName" placeholder="Student name" />
      <button id="addStudentBtn">Add student</button>
      <button id="clearStudentsBtn">Clear students</button>
    </div>
    <table id="studentsTable">
      <thead>
        <tr id="studentsHeader">
          <th>Student</th>
        </tr>
      </thead>
      <tbody id="studentsBody"></tbody>
    </table>
    <div class="row">
      <button id="recalcBtn">calculate summaries</button>
      <button id="exportCsvBtn">Export CSV</button>
    </div>
  </div>

  <div class="card">
    <h2>Summaries</h2>
    <div id="summaries"></div>
  </div>

  <script>
    // State
    const subjects = []; // ["Math", "Physics", ...]
    const students = []; // [{ name: "Alice", marks: { Math: 90, Physics: 85 } }, ...]

    // Helpers
    const grade = (percent) => {
      if (percent >= 90) return "A+";
      if (percent >= 80) return "A";
      if (percent >= 70) return "B+";
      if (percent >= 60) return "B";
      if (percent >= 50) return "C";
      if (percent >= 40) return "D";
      return "F";
    };
    const clampMark = (v) => {
      const n = Number(v);
      if (Number.isNaN(n)) return null;
      return Math.max(0, Math.min(100, n));
    };

    // DOM elements
    const subjectNameEl = document.getElementById("subjectName");
    const addSubjectBtn = document.getElementById("addSubjectBtn");
    const clearSubjectsBtn = document.getElementById("clearSubjectsBtn");
    const subjectsListEl = document.getElementById("subjectsList");

    const studentNameEl = document.getElementById("studentName");
    const addStudentBtn = document.getElementById("addStudentBtn");
    const clearStudentsBtn = document.getElementById("clearStudentsBtn");
    const studentsTableHead = document.getElementById("studentsHeader");
    const studentsBody = document.getElementById("studentsBody");

    const recalcBtn = document.getElementById("recalcBtn");
    const exportCsvBtn = document.getElementById("exportCsvBtn");
    const summariesEl = document.getElementById("summaries");

    // Render subjects list and table header
    function renderSubjects() {
      subjectsListEl.innerHTML = subjects.map(s => `<li>${s}</li>`).join("");
      studentsTableHead.innerHTML = `<th>Student</th>` + subjects.map(s => `<th>${s}</th>`).join("") + `<th>Total</th><th>%</th><th>Grade</th>`;
      // Ensure each student has keys for new subjects
      students.forEach(stu => {
        subjects.forEach(s => {
          if (!(s in stu.marks)) stu.marks[s] = "";
        });
      });
      renderStudentsTable();
    }

    // Render students rows
    function renderStudentsTable() {
      studentsBody.innerHTML = students.map((stu, rowIdx) => {
        const total = subjects.reduce((acc, s) => acc + (Number(stu.marks[s]) || 0), 0);
        const percent = subjects.length ? (total / (subjects.length * 100)) * 100 : 0;
        const g = grade(percent);
        const markInputs = subjects.map((s, colIdx) => {
          const val = stu.marks[s] ?? "";
          return `<td>
            <input size="4" value="${val}" 
              data-row="${rowIdx}" data-subject="${s}" class="mark-input" placeholder="0-100"/>
          </td>`;
        }).join("");
        return `<tr>
          <td>${stu.name}</td>
          ${markInputs}
          <td>${total.toFixed(0)}</td>
          <td>${percent.toFixed(1)}</td>
          <td>${g}</td>
        </tr>`;
      }).join("");
      // Attach input listeners
      document.querySelectorAll(".mark-input").forEach(inp => {
        inp.addEventListener("change", (e) => {
          const row = Number(e.target.dataset.row);
          const subj = e.target.dataset.subject;
          const v = clampMark(e.target.value);
          if (v === null) {
            alert("Please enter a number between 0 and 100.");
            e.target.value = "";
            return;
          }
          students[row].marks[subj] = v;
          renderStudentsTable();
        });
      });
    }

    // Calculate summaries
    function calculateSummaries() {
      if (students.length === 0 || subjects.length === 0) {
        summariesEl.innerHTML = "<p>Add subjects and students to see summaries.</p>";
        return;
      }

      const perStudent = students.map(stu => {
        const total = subjects.reduce((acc, s) => acc + (Number(stu.marks[s]) || 0), 0);
        const percent = subjects.length ? (total / (subjects.length * 100)) * 100 : 0;
        return { name: stu.name, total, percent, grade: grade(percent) };
      });

      const topper = perStudent.reduce((a, b) => (b.total > a.total ? b : a));
      const classAvgPercent = perStudent.reduce((acc, s) => acc + s.percent, 0) / perStudent.length;

      // Grade distribution
      const dist = {};
      ["A+", "A", "B+", "B", "C", "D", "F"].forEach(g => dist[g] = 0);
      perStudent.forEach(s => dist[s.grade]++);

      // Subject-wise averages and toppers
      const subjectStats = subjects.map(s => {
        const marks = students.map(stu => Number(stu.marks[s]) || 0);
        const avg = marks.reduce((a, b) => a + b, 0) / marks.length;
        let topMark = -1, topName = "";
        students.forEach(stu => {
          const m = Number(stu.marks[s]) || 0;
          if (m > topMark) { topMark = m; topName = stu.name; }
        });
        return { subject: s, average: avg, topper: topName, topMark };
      });

      // Render
      const gradeDistHtml = Object.entries(dist).map(([g, c]) => `<li>${g}: ${c}</li>`).join("");
      const subjHtml = subjectStats.map(ss => `<li>${ss.subject}: avg ${ss.average.toFixed(1)} | topper ${ss.topper} (${ss.topMark})</li>`).join("");
      summariesEl.innerHTML = `
        <p><strong>Topper:</strong> ${topper.name} (Total ${topper.total.toFixed(0)}, ${topper.percent.toFixed(1)}%, Grade ${topper.grade})</p>
        <p><strong>Class average %:</strong> ${classAvgPercent.toFixed(1)}%</p>
        <p><strong>Grade distribution:</strong></p>
        <ul>${gradeDistHtml}</ul>
        <p><strong>Subject-wise stats:</strong></p>
        <ul>${subjHtml}</ul>
      `;
    }

    // Export CSV
    function exportCSV() {
      if (students.length === 0 || subjects.length === 0) {
        alert("Nothing to export. Add subjects and students.");
        return;
      }
      const header = ["Student", ...subjects, "Total", "Percent", "Grade"];
      const rows = students.map(stu => {
        const total = subjects.reduce((acc, s) => acc + (Number(stu.marks[s]) || 0), 0);
        const percent = subjects.length ? (total / (subjects.length * 100)) * 100 : 0;
        const g = grade(percent);
        const marks = subjects.map(s => Number(stu.marks[s]) || 0);
        return [stu.name, ...marks, total.toFixed(0), percent.toFixed(1), g];
      });
      const csv = [header, ...rows].map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "marks.csv"; a.click();
      URL.revokeObjectURL(url);
    }

    // Event bindings
    addSubjectBtn.addEventListener("click", () => {
      const name = subjectNameEl.value.trim();
      if (!name) return;
      if (subjects.includes(name)) { alert("Subject already exists."); return; }
      subjects.push(name);
      subjectNameEl.value = "";
      renderSubjects();
    });
    clearSubjectsBtn.addEventListener("click", () => {
      if (!confirm("Clear all subjects? This will reset marks.")) return;
      subjects.length = 0;
      students.forEach(stu => stu.marks = {});
      renderSubjects();
      summariesEl.innerHTML = "";
    });

    addStudentBtn.addEventListener("click", () => {
      const name = studentNameEl.value.trim();
      if (!name) return;
      if (students.some(s => s.name.toLowerCase() === name.toLowerCase())) {
        alert("Student already exists."); return;
      }
      const marks = {};
      subjects.forEach(s => marks[s] = "");
      students.push({ name, marks });
      studentNameEl.value = "";
      renderStudentsTable();
    });
    clearStudentsBtn.addEventListener("click", () => {
      if (!confirm("Clear all students?")) return;
      students.length = 0;
      renderStudentsTable();
      summariesEl.innerHTML = "";
    });

    recalcBtn.addEventListener("click", calculateSummaries);
    exportCsvBtn.addEventListener("click", exportCSV);

    // Initial render
    renderSubjects();
  </script>
</body>

</html>
